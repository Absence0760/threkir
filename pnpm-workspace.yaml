packages:
  - apps/web
  - apps/backend

# Supply-chain pins: each nudges a transitive dependency off a version with a
# live advisory. The reason for each, and when to drop it, is in root
# package.json `_overrides_rationale`. Declared here rather than under
# package.json `pnpm.overrides`, which pnpm 11+ no longer reads: a newer pnpm
# (Dependabot's) regenerated the lockfile without them and every frozen
# install failed with ERR_PNPM_LOCKFILE_CONFIG_MISMATCH.
overrides:
  devalue: '^5.9.4'
  glob: '^14.0.3'
  source-map-js: '^1.2.2'

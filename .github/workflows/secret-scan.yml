name: secret-scan

# Secret-scan every push to main, every PR, and the full history once a week,
# with TruffleHog OSS. Catches accidentally-committed AWS keys, Supabase
# service-role tokens, Strava client secrets, Stripe and RevenueCat keys —
# anything one of its ~800 detectors recognises — and checks each candidate
# against its provider to say whether it is live.
#
# CALLED by ci.yml's `secret-scan` job for the push / PR half, and by
# `secret-scan-sweep.yml` for the weekly full-history sweep. It has no
# trigger of its own, deliberately: branch protection requires exactly one
# context, the `CI gate` aggregator in ci.yml, and a `needs:` entry cannot
# name a job in another workflow, so a scan on its own `pull_request` trigger
# goes red and the PR merges anyway (decisions § 1264). A called workflow's
# job result fans into the calling job, which the gate waits on. The cron
# lives in the sweep file because its reporting needs `issues: write`, and a
# callee may not request a permission its caller lacks — declaring it here
# failed `ci.yml` at STARTUP once (decisions § 1697).
#
# This replaced gitleaks.yml (decisions § 2552): gitleaks-action needs a
# license key (sign-up plus a secret) in a GitHub organization. The gitleaks
# pre-commit hook (.pre-commit-config.yaml, .gitleaks.toml) stays as the
# local, pre-push layer; TruffleHog does not read .gitleaks.toml.
#
# Complements existing controls:
#   - CodeQL (workflows/security.yml) — finds source-level injection
#     vulns, not secrets.
#   - Trivy (workflows/security.yml) — scans the built Docker image,
#     not the source tree.
#   - sops + AWS KMS for the secrets we mean to keep (in the private
#     infra-secrets repo) — defends correctly-stored secrets, doesn't
#     catch a stray paste.
#
# Why the binary and not trufflesecurity/trufflehog's action: the action runs
# a Docker image by tag (default `latest`), so it can't be pinned by digest.
# This installs the official release tarball, checked against the sha256
# below (from the release's trufflehog_<version>_checksums.txt). Bump
# TRUFFLEHOG_VERSION and TRUFFLEHOG_SHA256 together, to a release at least
# 7 days old. TruffleHog is AGPL-3.0; running it unmodified in CI creates no
# obligation (nothing is distributed or served to users).
#
# Scope. `github.event_name` in a called workflow is the CALLER's event, so:
#   - pull_request: the PR's commits (base.sha..head.sha).
#   - push to main: the pushed range (before..after); the whole history if
#     `before` is not in the clone (a force push).
#   - schedule / workflow_dispatch (the sweep): the whole history.
# Plus, on every event, the checked-out TREE (`trufflehog filesystem`), which
# on a PR is the merge ref: the code as it will exist on `main`. The range
# scan reads commits; the tree scan asks a question the commit graph cannot
# route around. It was added for gitleaks, whose action walked
# `--no-merges --first-parent`, so content arriving on a merge's second
# parent was never scanned (#994; decisions § 1719, § 1721). Both stay: the
# range scan still catches a secret committed and deleted within the branch.
#
# What fails the job:
#   - verified: the provider accepted the credential. It is live: rotate it
#     first, then deal with the commit. Once rotated it stops verifying, so
#     the next run passes without rewriting history.
#   - unknown: verification errored, so it may be live. Re-run; if it
#     persists, check the credential by hand.
# What only warns (annotation + job summary, job stays green):
#   - unverified: matched a detector but the provider rejected it or the
#     detector cannot verify. Mostly test fixtures, placeholders and dead
#     keys (the committed Supabase demo JWTs, for one); look at each one, and
#     mark a reviewed false positive with a `trufflehog:ignore` comment on
#     its line.
#
# Data flow: verification sends each candidate only to the API of the
# service that issued it (e.g. AWS STS GetCallerIdentity). No source code
# leaves GitHub. --no-update stops the self-update check. Results are written
# to a file, never the log, and the summary never prints a secret — this
# repository is public.

on:
  workflow_call:

# A called workflow cannot escalate past what the calling job grants; both
# callers grant `contents: read`, which is all this needs.
permissions:
  contents: read

jobs:
  scan:
    name: secret scan (trufflehog)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # check out the history to scan
    env:
      TRUFFLEHOG_VERSION: 3.99.8
      TRUFFLEHOG_SHA256: 7c3b02f160f28929a467e29e20fba98746e0729f6e37c3c25761e4f8789abe08 # trufflehog_3.99.8_linux_amd64.tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the scheduled sweep scans all of it, and the
          # PR / push ranges need both of their ends in the clone.
          fetch-depth: 0
          persist-credentials: false

      - name: Install TruffleHog (pinned release, sha256-verified)
        id: install
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/trufflehog"
          tarball="$dir/trufflehog.tar.gz"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$tarball" \
            "https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz"
          echo "${TRUFFLEHOG_SHA256}  $tarball" | sha256sum -c -
          tar -xzf "$tarball" -C "$dir" trufflehog
          "$dir/trufflehog" --version

      # A non-zero exit here is a scan error (findings never set it, since
      # --fail is not passed), so a broken scan never reads as clean.
      - name: Scan the commit range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          RESULTS: ${{ runner.temp }}/trufflehog.jsonl
        run: |
          set -euo pipefail
          args=(git "file://$PWD" --json --no-update --no-color
            --results=verified,unknown,unverified)
          case "$EVENT" in
            pull_request)
              args+=(--since-commit "$PR_BASE" --branch "$PR_HEAD")
              echo "Scanning: $PR_BASE..$PR_HEAD"
              ;;
            push)
              if [[ "$PUSH_BEFORE" =~ ^0+$ ]] || ! git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
                echo "Push base not in the clone; scanning the whole history."
              else
                args+=(--since-commit "$PUSH_BEFORE" --branch "$PUSH_AFTER")
                echo "Scanning: $PUSH_BEFORE..$PUSH_AFTER"
              fi
              ;;
            *)
              echo "Scanning: the whole history"
              ;;
          esac
          "$RUNNER_TEMP/trufflehog/trufflehog" "${args[@]}" >> "$RESULTS"

      # The tree as checked out (on a PR, the merge ref: what lands on `main`).
      # See the header's Scope paragraph for why this runs beside the range
      # scan. `.git/` is excluded: its objects are the history the range scan
      # and the sweep already read. Results append to the same file, so the
      # report below covers both; a finding in a commit still in the tree is
      # listed twice, once per scan.
      - name: Scan the working tree, not just the commit range
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          RESULTS: ${{ runner.temp }}/trufflehog.jsonl
        run: |
          set -euo pipefail
          exclude="$RUNNER_TEMP/trufflehog-exclude.txt"
          printf '%s\n' '(^|/)\.git/' > "$exclude"
          if ! "$RUNNER_TEMP/trufflehog/trufflehog" filesystem . --json --no-update --no-color \
              --results=verified,unknown,unverified --exclude-paths="$exclude" >> "$RESULTS"; then
            echo "::error::The working-tree scan errored, so it ran over nothing. This is a defect in this job, not a finding about the repo."
            exit 1
          fi

      - name: Report findings
        if: ${{ !cancelled() }}
        env:
          RESULTS: ${{ runner.temp }}/trufflehog.jsonl
        run: |
          set -euo pipefail
          if [ ! -f "$RESULTS" ]; then
            echo "## secret scan" >> "$GITHUB_STEP_SUMMARY"
            echo "No results file; see the Install and Scan steps." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          python3 - <<'PY'
          import json, os
          rows, failing = [], 0
          with open(os.environ["RESULTS"]) as f:
              for line in f:
                  line = line.strip()
                  if not line.startswith("{"):
                      continue
                  r = json.loads(line)
                  data = (r.get("SourceMetadata") or {}).get("Data") or {}
                  git = data.get("Git")
                  if git is not None:
                      where = (git.get("commit") or "")[:12]
                  else:
                      git = data.get("Filesystem") or {}
                      where = "tree"
                  if r.get("Verified"):
                      status = "verified"
                  elif r.get("VerificationError"):
                      status = "unknown"
                  else:
                      status = "unverified"
                  failing += status != "unverified"
                  rows.append((status, r.get("DetectorName", "?"), git.get("file", "?"),
                               git.get("line", "?"), where))
          order = {"verified": 0, "unknown": 1, "unverified": 2}
          rows.sort(key=lambda x: order[x[0]])
          for status, det, path, line, where in rows:
              level = "warning" if status == "unverified" else "error"
              src = "the working tree" if where == "tree" else f"commit {where}"
              print(f"::{level} file={path},line={line}::{status} {det} credential in {src}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as s:
              s.write("## secret scan (trufflehog)\n\n")
              if not rows:
                  s.write("No secrets found.\n")
              else:
                  s.write(f"**{failing} verified/unknown** (fail the job), "
                          f"**{len(rows) - failing} unverified** (warning only).\n\n")
                  s.write("| Status | Detector | File | Line | Commit |\n| --- | --- | --- | --- | --- |\n")
                  for status, det, path, line, where in rows:
                      s.write(f'| {status} | {det} | `{path}` | {line} | `{where}` |\n')
                  s.write('\nVerified: rotate the credential now. Unverified: review; mark a false '
                          'positive with a `trufflehog:ignore` comment on its line.\n')
          raise SystemExit(1 if failing else 0)
          PY

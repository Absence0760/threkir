name: ui_kit
description: Shared Flutter widgets and design tokens for the Run app.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.11.4
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  core_models:
    path: ../core_models

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  fonts:
    - family: Manrope
      fonts:
        - asset: fonts/Manrope-Light.ttf
          weight: 300
        - asset: fonts/Manrope-Regular.ttf
          weight: 400
        - asset: fonts/Manrope-Medium.ttf
          weight: 500
        - asset: fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: fonts/Manrope-Bold.ttf
          weight: 700
        - asset: fonts/Manrope-ExtraBold.ttf
          weight: 800
  assets:
    - fonts/OFL.txt

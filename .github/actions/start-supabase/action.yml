name: Start local Supabase stack
description: >
  Boot the local Supabase stack (applies migrations + seed.sql on the
  pinned 2.84.2 CLI) with a port-clean retry, then wait until its
  sidecars actually serve.

  Why a composite action rather than six inline copies: the start step
  is duplicated across every stack-using job (parity-types, schema
  drift, api-client, edge-functions, pgtap, e2e-web). It was drifting as
  byte-identical copies; one source of truth keeps the retry logic — and
  the incident history — from diverging.

  Both halves are shell files rather than inline `run:` blocks, so a job
  can drive them with stubs: start_stack.sh (the port-clean retry, five
  incidents deep) and wait_for_sidecars.sh (the readiness probes). Each
  file's header carries the incidents that shaped it, and each has a
  node:test suite the ci-diagnostics job runs.

runs:
  using: composite
  steps:
    # The reservation + retry ladder lives in start_stack.sh rather than
    # inline here so it can be unit-tested (start_stack.test.mjs drives it
    # with stub ss/docker/supabase/sudo on PATH); the incident history that
    # shaped it is in that file's header. Inline, the LISTEN-only port probe
    # that cost CI run 35626531071 three attempts was readable by nothing.
    - name: Start the stack with a port-clean retry
      shell: bash
      working-directory: apps/backend
      run: bash "$GITHUB_ACTION_PATH/start_stack.sh"

    # The probe loop + its forensics live in wait_for_sidecars.sh rather
    # than inline here so they can be unit-tested (wait_for_sidecars.test.mjs
    # drives them with stub curl/docker on PATH); the incident history that
    # shaped them is in that file's header.
    - name: Wait for the stack's sidecars to actually serve
      shell: bash
      working-directory: apps/backend
      run: |
        set -uo pipefail
        ANON_KEY=$(supabase status -o env | grep '^ANON_KEY=' | cut -d= -f2- | tr -d '"')
        export ANON_KEY
        bash "$GITHUB_ACTION_PATH/wait_for_sidecars.sh"

name: Release iOS

# Tag: `mobile_ios@1.2.3`. Builds the iPhone app with the Apple Watch app it
# embeds, signs each bundle for the App Store, attaches the .ipa to the Release and
# uploads it to TestFlight. Promotion from TestFlight to the App Store is a
# manual step in App Store Connect. apps/mobile_ios/deployment.md is the
# operator runbook for every secret below; decisions.md § 1701 is the design.
#
# Signing (the first step fails, naming every one that is unset):
#   IOS_BUILD_CERTIFICATE_BASE64          Apple Distribution certificate + key, as a .p12
#   IOS_P12_PASSWORD                      password the .p12 was exported with
#   IOS_PROVISIONING_PROFILE_BASE64       App Store profile for com.threkir.app
#   IOS_WATCH_PROVISIONING_PROFILE_BASE64 App Store profile for com.threkir.app.watchapp
#   IOS_SHARE_PROVISIONING_PROFILE_BASE64 App Store profile for com.threkir.app.ShareExtension
#   IOS_WATCH_COMPLICATION_PROVISIONING_PROFILE_BASE64
#                                         App Store profile for com.threkir.app.watchapp.complication,
#                                         the WidgetKit extension the watch app embeds
#   APP_STORE_CONNECT_API_KEY_ID          App Store Connect API key id
#   APP_STORE_CONNECT_API_ISSUER_ID       App Store Connect API issuer id
#   APP_STORE_CONNECT_API_PRIVATE_KEY     the key's .p8 file contents, as is (not base64)
#   GOOGLE_SERVICE_INFO_PLIST_BASE64      GoogleService-Info.plist from the Firebase
#                                         project's com.threkir.app iOS app; the Runner
#                                         target bundles it (docs/features/native_push.md)
#
# Production runtime config, written to dart_defines.json (decisions § 13: an
# `sb_publishable_` key does not survive an inline --dart-define on iOS) and
# seeded into dotenv by main.dart. The shared ones are the same secrets the web,
# Android and Wear OS releases read:
#   PUBLIC_SUPABASE_URL, PUBLIC_SUPABASE_ANON_KEY, PUBLIC_MAPTILER_KEY   (required)
#   MOBILE_OSRM_URL                       (optional; unset, the route builder places
#                                         straight lines and says so, as on Android)
#   PUBLIC_SENTRY_DSN, MOBILE_LIVE_HUB_URL, MOBILE_STRAVA_CLIENT_ID      (optional)
#
# The signing secrets and GOOGLE_SERVICE_INFO_PLIST_BASE64 live in the
# `production` environment beside Android's keystore; the PUBLIC_* ones are
# repository secrets shared with the web release.
#   MOBILE_REVENUECAT_API_KEY_IOS         (optional; unset, Pro is not for sale on
#                                         iOS, because iOS may not fall back to the
#                                         web checkout — decisions § 1700)

# Release-triggered: publishing a GitHub Release whose tag is `mobile_ios@*`
# runs this workflow — a bare `mobile_ios@*` tag push does NOT deploy. `on:
# release` fires for every published release in the repo, so the job below
# is guarded to `mobile_ios@*` tags.
on:
  release:
    types: [published]

# Least-privilege, and the release job does NOT opt up: the signed IPA is kept
# as a workflow ARTIFACT rather than attached to the Release, so nothing here
# writes to the repository and `contents: read` (which checkout needs) is the
# whole token. decisions.md § 1720 is why that swap, and not a dismissal.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Must equal ci.yml's FLUTTER_VERSION: CI is what validates the code this
  # workflow ships, so a release built on a different SDK than CI tested is
  # an untested binary. A release has no green/red signal to tell you the
  # toolchain moved either — an unpinned `channel: stable` here would ship
  # whatever Flutter was newest at tag time. `scripts/check_toolchain_pins.mjs`
  # (the `workflow-lint` job) fails CI if the three workflows disagree, so
  # bump them together. Rationale: decisions.md § 595.
  FLUTTER_VERSION: "3.47.0"

jobs:
  release:
    name: Build, sign and upload iOS to TestFlight
    runs-on: macos-latest
    # Guard: `on: release` fires for every published release in the repo,
    # so only act on mobile_ios@* releases.
    if: startsWith(github.event.release.tag_name, 'mobile_ios@')
    # Pause on the `production` environment's required-reviewer rule
    # before any prod credentials/steps run (repo Settings → Environments).
    environment: production
    steps:
      # Checked before a fifteen-minute build rather than inside it. Each value
      # is reduced to true/false here, so no secret reaches this step's shell.
      - name: Every secret this release needs is set
        env:
          HAS_IOS_BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 != '' }}
          HAS_IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD != '' }}
          HAS_IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 != '' }}
          HAS_IOS_WATCH_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_WATCH_PROVISIONING_PROFILE_BASE64 != '' }}
          HAS_IOS_SHARE_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_SHARE_PROVISIONING_PROFILE_BASE64 != '' }}
          HAS_IOS_WATCH_COMPLICATION_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_WATCH_COMPLICATION_PROVISIONING_PROFILE_BASE64 != '' }}
          HAS_APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID != '' }}
          HAS_APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID != '' }}
          HAS_APP_STORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY != '' }}
          HAS_GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 != '' }}
          HAS_PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL != '' }}
          HAS_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY != '' }}
          HAS_PUBLIC_MAPTILER_KEY: ${{ secrets.PUBLIC_MAPTILER_KEY != '' }}
        run: |
          missing=$(env | sed -n 's/^HAS_\([A-Z0-9_]*\)=false$/\1/p' | sort | tr '\n' ' ')
          if [ -n "$missing" ]; then
            echo "::error::These release secrets are unset: $missing-- the header of release-ios.yml says what each one is, and apps/mobile_ios/deployment.md how to make it."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Parse version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION_NAME="${TAG#mobile_ios@}"
          # CFBundleShortVersionString is at most three dot-separated integers;
          # App Store Connect rejects anything else after the whole build.
          if ! printf '%s' "$VERSION_NAME" | grep -Eq '^[0-9]+(\.[0-9]+){0,2}$'; then
            echo "::error::Tag $TAG carries version $VERSION_NAME, which is not one to three dot-separated integers. The App Store accepts nothing else."
            exit 1
          fi
          VERSION_CODE=$(git rev-list --count HEAD)
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - run: dart pub global activate melos 7.8.2
      - run: melos bootstrap

      - name: Pin version from tag
        working-directory: apps/mobile_ios
        run: |
          sed -i '' "s/^version: .*/version: ${{ steps.version.outputs.name }}+${{ steps.version.outputs.code }}/" pubspec.yaml
          grep '^version:' pubspec.yaml

      - name: Decode the Firebase config
        # Required here although the build tolerates its absence: the Runner's
        # copy phase bundles the plist when it is present and skips it when it
        # is not (decisions § 1693), so without this a release would build
        # green and ship with push silently off.
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          dest=apps/mobile_ios/ios/Runner/GoogleService-Info.plist
          echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 -d > "$dest"
          # An APNs token minted against the wrong project's plist is delivered
          # to nobody and reports no error, so check the bundle id here.
          if ! /usr/libexec/PlistBuddy -c 'Print :BUNDLE_ID' "$dest" 2>/dev/null | grep -qx 'com.threkir.app'; then
            echo "::error::$dest has no BUNDLE_ID of com.threkir.app. Add an iOS app with that bundle id to the Firebase project and re-download."
            exit 1
          fi

      - name: Stub the bundled dotenv asset
        # Same as release-android.yml: pubspec ships `.env.development` as an
        # asset, and release builds never read it (main.dart loads it only in
        # debug), so the shipped bundle gets an empty file rather than the
        # committed local-stack URLs.
        run: 'echo > apps/mobile_ios/.env.development'

      # The keychain password only has to outlive this job, so it is made here
      # rather than held as a secret.
      - name: Install the distribution certificate
        env:
          IOS_BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          echo "$IOS_BUILD_CERTIFICATE_BASE64" | base64 -d > "$RUNNER_TEMP/distribution.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/distribution.p12" -P "$IOS_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/distribution.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN"
          echo "KEYCHAIN_PATH=$KEYCHAIN" >> "$GITHUB_ENV"
          if ! security find-identity -v -p codesigning "$KEYCHAIN" | grep -q '"Apple Distribution: '; then
            echo "::error::IOS_BUILD_CERTIFICATE_BASE64 holds no Apple Distribution identity with its private key. Create an Apple Distribution certificate and export it together with its key as the .p12."
            exit 1
          fi

      # Switches the Release configuration of every signed target — the phone
      # app, the watch app, the share extension and the watch complication — to
      # manual signing against one profile each, derives the team from them, and
      # writes the ExportOptions.plist. A profile for the wrong bundle, a
      # development profile or a missing one fails here by name. The share
      # extension's profile must carry the App Group capability, or the
      # extension signs but its container lookup returns nil on device.
      - name: Point the archive at the App Store profiles
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_WATCH_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_WATCH_PROVISIONING_PROFILE_BASE64 }}
          IOS_SHARE_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_SHARE_PROVISIONING_PROFILE_BASE64 }}
          IOS_WATCH_COMPLICATION_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_WATCH_COMPLICATION_PROVISIONING_PROFILE_BASE64 }}
        run: |
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -d > "$RUNNER_TEMP/phone.mobileprovision"
          echo "$IOS_WATCH_PROVISIONING_PROFILE_BASE64" | base64 -d > "$RUNNER_TEMP/watch.mobileprovision"
          echo "$IOS_SHARE_PROVISIONING_PROFILE_BASE64" | base64 -d > "$RUNNER_TEMP/share.mobileprovision"
          echo "$IOS_WATCH_COMPLICATION_PROVISIONING_PROFILE_BASE64" | base64 -d > "$RUNNER_TEMP/complication.mobileprovision"
          node scripts/ios_release_signing.mjs apps/mobile_ios/ios/Runner.xcodeproj/project.pbxproj "$RUNNER_TEMP/ExportOptions.plist" "$RUNNER_TEMP/phone.mobileprovision" "$RUNNER_TEMP/watch.mobileprovision" "$RUNNER_TEMP/share.mobileprovision" "$RUNNER_TEMP/complication.mobileprovision"

      - name: Write the production runtime config
        working-directory: apps/mobile_ios
        # Dev-only keys (DEV_USER_*, BYPASS_PAYWALL, *_GATE) and the
        # sign-off-gated feature flags are deliberately absent, as on Android:
        # an absent key stays fail-closed.
        env:
          SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          MAPTILER_KEY: ${{ secrets.PUBLIC_MAPTILER_KEY }}
          SENTRY_DSN: ${{ secrets.PUBLIC_SENTRY_DSN }}
          OSRM_URL: ${{ secrets.MOBILE_OSRM_URL }}
          LIVE_HUB_URL: ${{ secrets.MOBILE_LIVE_HUB_URL }}
          STRAVA_CLIENT_ID: ${{ secrets.MOBILE_STRAVA_CLIENT_ID }}
          REVENUECAT_API_KEY_IOS: ${{ secrets.MOBILE_REVENUECAT_API_KEY_IOS }}
          APP_RELEASE: ${{ steps.version.outputs.name }}
        run: |
          jq -n '{
            SUPABASE_URL: env.SUPABASE_URL,
            SUPABASE_ANON_KEY: env.SUPABASE_ANON_KEY,
            MAPTILER_KEY: env.MAPTILER_KEY,
            WEB_BASE_URL: "https://threkir.com",
            OSRM_URL: env.OSRM_URL,
            LIVE_HUB_URL: env.LIVE_HUB_URL,
            SENTRY_DSN: env.SENTRY_DSN,
            STRAVA_CLIENT_ID: env.STRAVA_CLIENT_ID,
            REVENUECAT_API_KEY_IOS: env.REVENUECAT_API_KEY_IOS,
            APP_RELEASE: env.APP_RELEASE
          }' > dart_defines.json

      - name: Build the signed IPA
        working-directory: apps/mobile_ios
        run: flutter build ipa --release --export-options-plist="$RUNNER_TEMP/ExportOptions.plist" --dart-define-from-file=dart_defines.json

      - name: Find the IPA
        id: ipa
        working-directory: apps/mobile_ios
        run: |
          found=$(find build/ios/ipa -maxdepth 1 -name '*.ipa')
          count=$(printf '%s' "$found" | grep -c . || true)
          if [ "$count" != 1 ]; then
            echo "::error::Expected exactly one .ipa in apps/mobile_ios/build/ios/ipa after the signed build and found $count."
            exit 1
          fi
          echo "path=apps/mobile_ios/$found" >> "$GITHUB_OUTPUT"

      # Before the upload, as on Android: if TestFlight refuses the build, the
      # signed IPA still lands somewhere durable to upload by hand. An artifact
      # rather than a Release asset, because attaching one is the only thing in
      # this workflow that wanted `contents: write` and the artifact service
      # takes no `contents` scope at all (decisions § 1720). Two consequences
      # worth knowing before you need it: retention is finite, and the download
      # needs repo access — which on a PUBLIC repo is the point, a signed
      # production binary was world-readable on the Release.
      # `if-no-files-found: error` is `fail_on_unmatched_files` under another
      # name and stays on — an attach that matched nothing once reported
      # success here (decisions § 1673).
      - name: Keep the signed IPA as an artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ github.event.release.tag_name }}-ipa
          path: apps/mobile_ios/build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 90

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@5e75ff58276689011512ba87a381d93dc67dbcf8 # v5.3.0
        with:
          app-path: ${{ steps.ipa.outputs.path }}
          issuer-id: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}

      - name: Remove the signing keychain and the runtime config
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ]; then security delete-keychain "$KEYCHAIN_PATH" || true; fi
          rm -f apps/mobile_ios/dart_defines.json "$RUNNER_TEMP"/*.mobileprovision

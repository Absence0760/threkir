name: Dependency audit

# Weekly scheduled audit + manual trigger. Runs `pnpm audit` AND `npm audit`
# (the two lockfiles drift independently — see the audit step) against all
# workspaces and opens an issue if any vulnerabilities at moderate or
# higher severity are found. Closes the issue automatically when the next
# clean run completes.
on:
  schedule:
    # 06:00 UTC every Monday — early enough to land in the inbox before
    # any work starts, late enough that the cron isn't competing with
    # peak workflow scheduler load.
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Read-only by default. Only `report`, which runs no repository code and
# installs nothing, may write issues: the audit job runs `pnpm install`, and
# a token that can edit issues has no business beside third-party packages.
permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    outputs:
      exit_code: ${{ steps.audit.outputs.exit_code }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Matches the rest of the workflows in this repo (ci.yml,
          # release-web.yml, compliance-drift.yml)
          # — was 22, bumped to 24 per /audit/deps May 2026 to close
          # the workflow-Node-version drift Low.
          node-version: 24.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run dependency audits (both lockfiles)
        id: audit
        run: |
          set +e
          # --audit-level=moderate ignores low/info findings (typically
          # noise from dev-only deps with no real exposure). The exit
          # code is non-zero when issues are found at >= the level.
          #
          # BOTH lockfiles are audited. They drift independently, and for a
          # while only pnpm-lock.yaml was checked — while package-lock.json
          # is what CI's `npm ci` jobs and the web build compile gate
          # actually install. Two high-severity advisories sat in it
          # unreported behind a clean pnpm audit (issue #633). Dependabot
          # does not close the gap either: it bumps DECLARED dependencies,
          # so a transitive six levels down a `^` range is only ever
          # refreshed by `npm audit fix --package-lock-only`.
          pnpm audit --audit-level=moderate --json > audit-pnpm.json
          pnpm_code=$?
          npm audit --audit-level=moderate --package-lock-only --json > audit-npm.json
          npm_code=$?
          if [ "$pnpm_code" != "0" ] || [ "$npm_code" != "0" ]; then
            echo "exit_code=1" >> "$GITHUB_OUTPUT"
          else
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "## Dependency audit findings (moderate or higher)"
            echo ""
            echo "### pnpm-lock.yaml (exit $pnpm_code)"
            echo '```json'
            head -c 30000 audit-pnpm.json
            echo ''
            echo '```'
            echo ""
            echo "### package-lock.json (exit $npm_code)"
            echo '```json'
            head -c 30000 audit-npm.json
            echo ''
            echo '```'
          } > audit-summary.md
          cat audit-summary.md

      - name: Keep the findings for the report job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audit-summary
          path: audit-summary.md
          retention-days: 7

  report:
    needs: audit
    runs-on: ubuntu-latest
    permissions:
      issues: write # open, update or close the dependency-audit issue
    steps:
      - name: Fetch the findings
        if: needs.audit.outputs.exit_code != '0'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: audit-summary

      - name: Open or update tracking issue on findings
        if: needs.audit.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Ensure the label exists. Idempotent — silently no-ops if already
          # there. Lets the workflow run cleanly on a fresh repo.
          gh label create dependency-audit --repo "$REPO" \
            --color FBCA04 \
            --description "Findings from the scheduled dependency-audit workflow" \
            2>/dev/null || true

          # Look for an existing open issue tagged "dependency-audit". If
          # one exists, update its body; otherwise create a new one.
          existing=$(gh issue list --repo "$REPO" --state open \
            --label dependency-audit --json number --jq '.[0].number // empty')

          body_file=audit-summary.md
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --repo "$REPO" --body-file "$body_file"
            gh issue comment "$existing" --repo "$REPO" \
              --body "Re-detected on $(date -u +%Y-%m-%d). See workflow run $GITHUB_RUN_ID."
          else
            gh issue create --repo "$REPO" \
              --title "Dependency audit: vulnerabilities detected" \
              --body-file "$body_file" \
              --label dependency-audit
          fi

      - name: Close tracking issue on clean run
        if: needs.audit.outputs.exit_code == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          existing=$(gh issue list --repo "$REPO" --state open \
            --label dependency-audit --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue close "$existing" --repo "$REPO" \
              --comment "Audit clean as of $(date -u +%Y-%m-%d) — closing automatically."
          fi

  # esm.sh rebuilds a versioned URL while serving it as immutable, and its CDN
  # can serve the old and new builds at once, so a deno.lock integrity pin can
  # go stale without any commit here. A run that restores the DENO_DIR cache
  # never notices; the first cold resolve fails the edge-functions job on
  # whatever PR or merge it lands on (main, 2026-11-03, decisions § 2257).
  # Resolving cold each week moves that failure here, off the merge path.
  deno-lock-pins:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.20.0

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.6

      - name: Resolve the Edge Function graph cold against deno.lock
        run: |
          if ! node scripts/refresh_deno_lock_remote.mjs --check; then
            echo "::error::An esm.sh integrity pin in deno.lock no longer matches what its URL serves, so the next cold Edge Function test run will fail. Nothing here is about the npm audit above."
            echo "Run 'pnpm refresh:deno-lock-remote' locally, review each moved pin it prints, and commit deno.lock."
            exit 1
          fi

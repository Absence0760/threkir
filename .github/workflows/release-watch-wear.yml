name: Release Wear OS

# Tag: `watch_wear@1.2.3`. Builds a signed release AAB and puts it on the
# Wear OS internal testing track of the PHONE app's package, `com.threkir.app`:
# Wear OS is a form factor of the phone's Play listing, not an app of its own
# (decisions § 2480). Promotion to Wear OS production stays a Play Console step
# after a real-watch smoke test.
#
# One package means one app signing key and one upload key, so this signs with
# the phone app's upload keystore, and one set of version codes across every
# track of the app, so the watch's are offset into a range the phone's
# commit-count codes can never reach (WEAR_VERSION_CODE_OFFSET below).
#
# Secrets read (all on the `production` environment, shared with
# release-android.yml):
#   ANDROID_KEYSTORE_BASE64       base64-encoded upload-keystore.jks
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#   PLAY_SERVICE_ACCOUNT_JSON     the release-android.yml service account

# Release-triggered: publishing a GitHub Release whose tag is `watch_wear@*`
# runs this workflow — a bare `watch_wear@*` tag push does NOT deploy. `on:
# release` fires for every published release in the repo, so the job below
# is guarded to `watch_wear@*` tags.
on:
  release:
    types: [published]

# Least-privilege default; the release job opts up to `contents: write`
# for the GitHub Release step.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Play refuses a version code already used by any track of the app, and the
  # phone's is `git rev-list --count HEAD` (about 5,200 in 2026-11), so a phone
  # and a watch build of one commit would collide. The watch's code is this
  # offset plus the same count: disjoint from the phone's until the repo holds a
  # billion commits, and below Play's 2,100,000,000 ceiling for 1.1 billion
  # more. Never lower it: version codes only go up. Pinned by
  # scripts/play_release.test.mjs.
  WEAR_VERSION_CODE_OFFSET: "1000000000"

jobs:
  release:
    name: Build, sign, upload Wear AAB
    runs-on: ubuntu-latest
    # Guard: `on: release` fires for every published release in the repo,
    # so only act on watch_wear@* releases.
    if: startsWith(github.event.release.tag_name, 'watch_wear@')
    # Pause on the `production` environment's required-reviewer rule before
    # any prod credentials or steps run. It is also where the signing and
    # Play secrets live: PLAY_SERVICE_ACCOUNT_JSON and the ANDROID_*
    # keystore secrets are environment secrets, invisible to a job that
    # names no environment.
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Parse version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION_NAME="${TAG#watch_wear@}"
          VERSION_CODE=$((WEAR_VERSION_CODE_OFFSET + $(git rev-list --count HEAD)))
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      # No dependency cache on a release build: a cache is writable by any
      # workflow run on the default branch, so restoring one here would let a
      # poisoned entry reach a signed artifact. A release builds from a cold
      # Gradle home every time.

      - name: Pin versionCode + versionName from tag
        working-directory: apps/watch_wear/android/app
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          # watch_wear's gradle file hardcodes versionCode / versionName
          # today. Rewrite those two lines in place before building so
          # the signed artifact carries the tag's numbers.
          sed -i "s/versionCode = [0-9]*/versionCode = ${VERSION_CODE}/" build.gradle.kts
          sed -i "s/versionName = \".*\"/versionName = \"${VERSION_NAME}\"/" build.gradle.kts
          grep -E 'versionCode|versionName' build.gradle.kts

      - name: Decode release keystore
        # The phone app's upload key: Play accepts a bundle for com.threkir.app
        # signed with that key only, whichever form factor it is for.
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > apps/watch_wear/android/app/upload-keystore.jks
          # Both halves mirror the mobile release workflow, which documents
          # having already hit each of them:
          #  - printf from env vars, NOT a secrets-interpolated heredoc: an
          #    unquoted heredoc shell-expands the substituted values, silently
          #    mangling a password containing a dollar sign or a backtick.
          #  - storeFile is resolved by Gradle's file() relative to the
          #    android/app module dir, not android/ where key.properties lives,
          #    so an `app/` prefix doubles into android/app/app/ and
          #    validateSigningRelease fails with "Keystore file not found".
          #    key.properties exists by then, so the release signing config is
          #    selected and the build fails hard rather than falling back.
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
            "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_ALIAS" \
            > apps/watch_wear/android/key.properties

      - name: Verify keystore credentials
        # Fail in seconds on a wrong store password or missing alias rather
        # than at signReleaseBundle, as release-android.yml does.
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keytool -list -keystore apps/watch_wear/android/app/upload-keystore.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" > /dev/null

      - name: Build AAB (signed)
        working-directory: apps/watch_wear/android
        # Every value reaches gradle through the environment, never through a
        # `${{ }}` spliced into the script: the release tag is free text, and a
        # quote in it would end the argument and run what follows.
        env:
          SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          PUBLIC_MAPTILER_KEY: ${{ secrets.PUBLIC_MAPTILER_KEY }}
          SENTRY_DSN: ${{ secrets.WATCH_WEAR_SENTRY_DSN }}
          APP_RELEASE: ${{ github.event.release.tag_name }}
        run: |
          # Use the same PUBLIC_SUPABASE_* secret names the web release
          # workflow reads — keeps a single pair of GitHub secrets in
          # sync with the Supabase project's anon key + URL across all
          # client deploys.
          #
          # SENTRY_DSN is optional: unset, the build carries an empty DSN and
          # WatchWearApplication leaves Sentry off (decisions § 1763).
          ./gradlew bundleRelease \
            -PSUPABASE_URL="$SUPABASE_URL" \
            -PSUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            -PPUBLIC_MAPTILER_KEY="$PUBLIC_MAPTILER_KEY" \
            -PSENTRY_DSN="$SENTRY_DSN" \
            -PAPP_RELEASE="$APP_RELEASE" \
            --no-daemon

      - name: Attach artifacts to the Release
        # The Release already exists — it triggered this run. Upload the
        # signed AAB onto it (no name/notes → the human-authored release
        # title + notes aren't clobbered). Runs BEFORE the Play upload, as in
        # release-android.yml: when that upload fails (Play permissions, the
        # manual-first-upload rule for a new app), the signed AAB must still
        # land somewhere it can be hand-uploaded from.
        #
        # Deliberately AAB-only, matching release-android.yml. A directly
        # installable `.apk` here would be distribution outside Google
        # Play, which from 2026-09-30 requires the package to be registered
        # by hand in the Android Developer Console. Play-only distribution
        # auto-registers it.
        #
        # `gh release upload` exits non-zero on a path that does not exist,
        # so a moved build output fails here rather than attaching nothing
        # (decisions.md § 1674). `--clobber` replaces an asset of the same
        # name, so re-running the job re-attaches instead of failing.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            apps/watch_wear/android/app/build/outputs/bundle/release/app-release.aab

      # Not r0adkll/upload-google-play: its commit takes Play's default,
      # CANCEL_IN_REVIEW_AND_SUBMIT, and under one package a phone release in
      # review is exactly what a Wear upload would cancel and resubmit. The
      # script commits with ERROR_IF_IN_REVIEW, skips an upload Play already
      # holds (a re-run), and finds the Wear internal track by name.
      - name: Upload to the Wear OS internal track
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          node scripts/play_release.mjs upload --package com.threkir.app --form-factor wear \
            --version-code "$VERSION_CODE" \
            --bundle apps/watch_wear/android/app/build/outputs/bundle/release/app-release.aab

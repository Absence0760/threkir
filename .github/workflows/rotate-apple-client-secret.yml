name: Rotate Apple OAuth client secret

# Regenerates the Sign in with Apple client secret and writes it into the
# production Supabase project's Apple provider, monthly.
#
# Supabase's web (OAuth) Apple flow authenticates to Apple with an ES256 JWT
# signed by the Sign-in-with-Apple .p8 key, and Apple refuses one older than six
# months. When it lapses, every web Apple sign-in fails with `invalid_client` on
# a configuration that is otherwise right, and nothing in our logs separates it
# from a misconfiguration. This replaced a calendar reminder: each run signs a
# 180-day secret, so the live one is never more than a month old and a missed
# run has five months of slack. The native iOS flow does not use this secret.
# Operator runbook: docs/ops/apple_provisioning.md § 9. Design: decisions.md
# § 1824.
#
# Secrets, all on the `apple-secret-rotation` environment (the rotation step
# fails, naming every one that is unset, and prints none of their values):
#   APPLE_TEAM_ID            Apple Developer Team ID (estate `apple_team_id`)
#   APPLE_SIWA_KEY_ID        the Sign-in-with-Apple key's Key ID (estate `siwa_key_id`)
#                            -- the same key the Edge Functions hold as APPLE_KEY_ID;
#                            NOT the APNs key and NOT the App Store Connect key
#   APPLE_SIWA_PRIVATE_KEY   that key's .p8 contents, PEM as is (estate `siwa_key_p8`)
#   SUPABASE_ACCESS_TOKEN    a Supabase personal access token for the Management API;
#                            mint one for this job alone so it can be revoked alone
#   SUPABASE_PROJECT_REF     the production project ref (same value as on `production`)
# The estate file is infra-secrets `threkir/push-credentials.sops.yaml`.
#
# WHY NOT THE `production` ENVIRONMENT. It holds the Supabase token already, but
# it requires a reviewer, and a scheduled run that waits for an approval nobody
# is watching for is the calendar reminder again with extra steps. The dedicated
# environment carries no reviewer and must be restricted to the `main` branch
# (Settings -> Environments -> Deployment branches), so only workflow code that
# reached `main` through the CI gate can read these secrets.
#
# A red run opens an `apple-secret` issue and a green one closes it (the shape
# gitleaks-sweep.yml and audit.yml use): a scheduled job reaches no merge gate,
# so a failure that only lands in the Actions tab reaches nobody.

on:
  schedule:
    # 06:00 UTC on the 1st, beside the other scheduled jobs' hour.
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: rotate-apple-client-secret
  cancel-in-progress: false

jobs:
  rotate:
    name: Sign and install a fresh client secret
    runs-on: ubuntu-latest
    environment: apple-secret-rotation
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0

      # Stdlib only, so there is nothing to install. The script reads the
      # current config, refuses to write unless com.threkir.web is the first
      # Client ID, PATCHes external_apple_secret alone and reads it back.
      - name: Rotate the client secret
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIWA_KEY_ID: ${{ secrets.APPLE_SIWA_KEY_ID }}
          APPLE_SIWA_PRIVATE_KEY: ${{ secrets.APPLE_SIWA_PRIVATE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if ! node scripts/rotate_apple_client_secret.mjs; then
            echo "::error::The Apple OAuth client secret was not rotated. The line above names the cause; docs/ops/apple_provisioning.md § 9 says what to do. The previous secret stays live until its own expiry."
            exit 1
          fi

  report:
    name: Surface a failed rotation
    needs: rotate
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the tracking issue
        if: needs.rotate.result != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh label create apple-secret --repo "$REPO" \
            --color B60205 \
            --description "The monthly Apple OAuth client-secret rotation failed" \
            2>/dev/null || true

          {
            echo "The monthly Sign in with Apple client-secret rotation did not complete."
            echo ""
            echo "- Run: $RUN_URL"
            echo "- Effect: none yet. The secret already installed stays valid until its own"
            echo "  expiry, up to six months after the last green run, after which every web"
            echo "  Apple sign-in fails with \`invalid_client\`."
            echo ""
            echo "The run's error line names the cause. The fixes are in"
            echo "\`docs/ops/apple_provisioning.md\` § 9; then rerun the workflow by hand."
            echo ""
            echo "This issue closes itself on the next green rotation."
          } > body.md

          existing=$(gh issue list --repo "$REPO" --state open \
            --label apple-secret --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --repo "$REPO" --body-file body.md
            gh issue comment "$existing" --repo "$REPO" \
              --body "Still failing as of $(date -u +%Y-%m-%d). Run: $RUN_URL"
          else
            gh issue create --repo "$REPO" \
              --title "Apple OAuth client-secret rotation is failing" \
              --body-file body.md \
              --label apple-secret
          fi

      - name: Close the tracking issue on a green rotation
        if: needs.rotate.result == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          existing=$(gh issue list --repo "$REPO" --state open \
            --label apple-secret --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue close "$existing" --repo "$REPO" \
              --comment "Rotated cleanly as of $(date -u +%Y-%m-%d) — closing automatically."
          fi
